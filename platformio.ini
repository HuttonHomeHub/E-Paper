; PlatformIO project configuration
; Board : Waveshare e-Paper ESP32 Driver Board (SKU 15823, ESP32-WROOM-32)
; Panel : Waveshare 7.5" e-Paper raw display, 800x480, black/white (SKU 13187)
;
; Docs: https://docs.platformio.org/page/projectconf.html

; Two environments:
;   esp32  - the firmware (default)
;   native - host-side unit tests, run with `pio test -e native` (no board needed)
[platformio]
default_envs = esp32

[env:esp32]
; Pinned so a new platform release can't change the build unannounced. To see
; what is newer: `pio pkg outdated`. CI also builds against the latest platform
; monthly, so a red monthly run means an upgrade needs attention.
platform  = espressif32 @ 7.0.1
board     = esp32dev          ; generic ESP32-WROOM-32 dev module - matches the driver board
framework = arduino

; Unit tests run on the host (env:native); never try to flash them to the board.
test_ignore = *

; Serial monitor for the Serial.print() output from the firmware.
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; Flashing speed. If uploads fail or the log fills with junk, drop this to 115200.
upload_speed = 921600

; Uncomment and set this if PlatformIO picks the wrong serial port on your machine.
; Windows looks like COM5, macOS like /dev/cu.usbserial-0001, Linux like /dev/ttyUSB0.
; upload_port  = COM5
; monitor_port = COM5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Libraries (lib/BinFeed) read include/secrets.h; PlatformIO only adds
    ; include/ to the path for src/ by default.
    -Iinclude

; --- Troubleshooting switches ---
; If the panel never releases its BUSY line ("BUSY TIMEOUT" in the serial log),
; uncomment the line below. Some driver board revisions gate the panel's power
; through GPIO33, and without this the panel is simply never powered on.
;   -D D_9PIN=1
;
; If a legitimately slow refresh trips the 20s busy timeout, raise it:
;   -D EPD_BUSY_TIMEOUT_MS=40000

[env:native]
platform = native @ 1.2.1
; Only the hardware-free library is under test; skip everything that needs the
; Arduino framework or the display driver.
lib_ignore =
    CalendarRender
    BinRender
    BinFeed
    UkClock
    UiKit
    WaveshareEPD
